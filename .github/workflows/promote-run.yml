name: Promote an already built ONX matrix
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed CI run containing candidate-recipes and package-* artifacts
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  smoke-and-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Remove stale generated recipes
        run: git rm -r --ignore-unmatch generated/main generated/bootstrap.json
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: package-*
          path: build-output/packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          name: candidate-recipes
          path: generated
      - uses: actions/checkout@v4
        with:
          repository: onlynux-linux/tatami
          ref: ffdece8c0bae9eacd7655f793eced92aaef22e82
          path: tatami
          persist-credentials: false
      - run: docker build -f ci/Dockerfile -t onx-build:ci .
      - name: Check manifests, install through Tatami and exercise programs
        run: |
          docker run --rm --network=none \
            -v "$PWD/build-output/packages:/packages:ro" \
            -v "$PWD/ci/install_smoke.py:/install_smoke.py:ro" \
            onx-build:ci python3 /install_smoke.py
      - name: Publish only after the smoke test succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: |
          git config user.name "onlynux-build"
          git config user.email "onlynux-build@users.noreply.github.com"
          git add -A generated
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Promote ONXBUILD recipes verified by CI run $SOURCE_RUN"
          git -c credential.helper='!gh auth git-credential' push origin HEAD:main
