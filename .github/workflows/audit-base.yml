name: Audit complete Onlynux base set
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog/base.json'
      - 'onx/audit.py'
      - 'onx/gentoo.py'
      - 'onx/propose.py'
      - 'policies/base.json'
      - '.github/workflows/audit-base.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'git+https://github.com/gentoo/portage.git@8c2b6e0c3f789f3dec267565d84791a9fe716cdc'
      - uses: actions/checkout@v4
        with:
          repository: gentoo/gentoo
          ref: 0e4ff85c8ca9036d26b5c028a93742aaca63733a
          path: gentoo
          persist-credentials: false
      - name: Audit all requested base packages
        id: audit
        shell: bash
        run: |
          set +e
          python -m onx.cli audit-base --catalog catalog/base.json --policy policies/base.json --gentoo gentoo --output base-audit
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat base-audit/SUMMARY.md
      - name: Publish auditable inventory
        if: always()
        shell: bash
        run: |
          mkdir -p audits/base
          cp base-audit/base-audit.json audits/base/base-audit.json
          cp base-audit/SUMMARY.md audits/base/README.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audits/base
          if ! git diff --cached --quiet; then
            git commit -m "Publish complete base package audit"
            git push
          fi
      - name: Enforce catalog validity
        if: always()
        shell: bash
        run: test "${{ steps.audit.outputs.exit_code }}" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-base-audit
          path: base-audit/
