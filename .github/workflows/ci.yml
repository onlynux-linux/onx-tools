name: ONX import, build and install
on:
  push:
    branches: [main]
    paths-ignore: ['generated/**', 'audits/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  prepare:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Portage metadata evaluator
        run: python -m pip install 'git+https://github.com/gentoo/portage.git@8c2b6e0c3f789f3dec267565d84791a9fe716cdc'
      - uses: actions/checkout@v4
        with:
          repository: gentoo/gentoo
          ref: 0e4ff85c8ca9036d26b5c028a93742aaca63733a
          path: gentoo
          persist-credentials: false
      - name: Generate independent ONXBUILD recipes
        run: |
          python -m onx.cli import gzip sed coreutils findutils diffutils grep gawk which tar ncurses less nano file bash pam dosfstools pciutils ethtool traceroute man-pages openssl kbd kmod procps-ng scdoc e2fsprogs iproute2 iputils util-linux f2fs-tools acpid libxcrypt shadow tzdata iana-etc libmd dhcpcd --policy policies/base.json --gentoo gentoo --output candidate-recipes
          python -m onx.cli propose app-arch/gzip-1.14 --gentoo gentoo --policy policies/base.json --output draft-recipes
          python -m onx.cli lint candidate-recipes
          python -m onx.cli plan gzip sed coreutils findutils diffutils grep gawk which tar ncurses less nano file bash pam dosfstools pciutils ethtool traceroute man-pages openssl kbd kmod procps-ng e2fsprogs iproute2 iputils util-linux f2fs-tools acpid libxcrypt shadow tzdata iana-etc libmd dhcpcd --recipes candidate-recipes
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-recipes
          path: candidate-recipes/

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target: [gzip, sed, coreutils, findutils, diffutils, grep, gawk, which, tar, ncurses, less, nano, file, bash, pam, dosfstools, pciutils, ethtool, traceroute, man-pages, openssl, kbd, kmod, procps-ng, e2fsprogs, iproute2, iputils, util-linux, f2fs-tools, acpid, libxcrypt, shadow, tzdata, iana-etc, libmd, dhcpcd]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-recipes
          path: candidate-recipes
      - uses: actions/checkout@v4
        with:
          repository: onlynux-linux/tatami
          ref: ffdece8c0bae9eacd7655f793eced92aaef22e82
          path: tatami
          persist-credentials: false
      - name: Build Linux bootstrap image with native Tatami
        run: docker build -f ci/Dockerfile -t onx-build:ci .
      - name: Build and test upstream source without network
        run: python -m onx.cli build "${{ matrix.target }}" --recipes candidate-recipes --work build-output --image onx-build:ci --allow-unsigned
      - name: Stage only the matrix target package
        run: |
          mkdir -p staged/x86_64
          cp build-output/packages/x86_64/"${{ matrix.target }}-"*.onx staged/x86_64/
          cp build-output/packages/x86_64/"${{ matrix.target }}-"*.build.json staged/x86_64/
          test "$(find staged/x86_64 -name "*.onx" | wc -l)" -eq 1
          test "$(find staged/x86_64 -name "*.build.json" | wc -l)" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: staged/

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: build-output/packages
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          repository: onlynux-linux/tatami
          ref: ffdece8c0bae9eacd7655f793eced92aaef22e82
          path: tatami
          persist-credentials: false
      - run: docker build -f ci/Dockerfile -t onx-build:ci .
      - name: Install real ONX packages and exercise the programs
        run: |
          docker run --rm --network=none \
            -v "$PWD/build-output/packages:/packages:ro" \
            -v "$PWD/ci/install_smoke.py:/install_smoke.py:ro" \
            onx-build:ci python3 /install_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-development-onx
          path: build-output/packages/

  publish-generated:
    if: github.event_name != 'pull_request'
    needs: [prepare, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Remove stale generated recipes
        run: git rm -r --ignore-unmatch generated/main generated/bootstrap.json
      - uses: actions/download-artifact@v4
        with:
          name: candidate-recipes
          path: generated
      - name: Record build-verified recipes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "onlynux-build"
          git config user.email "onlynux-build@users.noreply.github.com"
          git add -A generated
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record ONXBUILD recipes verified by Linux CI"
          git pull --rebase origin main
          git -c credential.helper='!gh auth git-credential' push origin HEAD:main
