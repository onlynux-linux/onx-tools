name: Propose Gentoo ONXBUILD
on:
  workflow_dispatch:
    inputs:
      cpv:
        description: Pinned Gentoo category/package-version, for example sys-apps/coreutils-9.10
        required: true
        type: string
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'git+https://github.com/gentoo/portage.git@8c2b6e0c3f789f3dec267565d84791a9fe716cdc'
      - uses: actions/checkout@v4
        with:
          repository: gentoo/gentoo
          ref: 0e4ff85c8ca9036d26b5c028a93742aaca63733a
          path: gentoo
          persist-credentials: false
      - name: Generate draft and unresolved-dependency report
        env:
          CPV: ${{ inputs.cpv }}
        run: python -m onx.cli propose "$CPV" --gentoo gentoo --policy policies/base.json --output proposed
      - uses: actions/upload-artifact@v4
        with:
          name: onx-draft
          path: proposed/
